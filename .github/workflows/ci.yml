name: foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: lost_found_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d lost_found_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://app_user:ci_only_password@localhost:5432/lost_found_test
      TEST_DATABASE_URL: postgresql://app_user:ci_only_password@localhost:5432/integration_test
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit high and critical dependency advisories
        run: bun audit --audit-level high
      - run: bun run env:check
      - name: Create separate integration database
        run: node --input-type=module -e "import pg from 'pg'; const p = new pg.Pool({connectionString:process.env.DATABASE_URL}); try { await p.query('CREATE DATABASE integration_test'); } finally { await p.end(); }"
      - run: bun run db:migrate
      - run: bun run db:migrate:status
      - run: bun run db:cleanup-auth
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run build
      - name: Build container
        run: docker build -f infra/docker/Dockerfile -t campus-foundation:ci .
      - name: Verify non-root container liveness and database readiness
        run: |
          docker run -d --name foundation --network host -e APP_BASE_URL=http://localhost:3000 -e DATABASE_URL="$DATABASE_URL" campus-foundation:ci
          test "$(docker inspect --format '{{.Config.User}}' foundation)" = node
          for attempt in {1..30}; do
            if curl --fail --max-time 5 http://localhost:3000/api/v1/health/live && curl --fail --max-time 5 http://localhost:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs foundation
          exit 1
