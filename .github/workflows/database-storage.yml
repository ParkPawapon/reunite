name: database-storage
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Trigger a test failure to verify operator notifications
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: vars.DATABASE_STORAGE_MONITOR_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check database storage threshold
        run: bun run db:storage:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STORAGE_MONITOR_URL }}
          DB_SSL: verify-full
          DB_SSL_CA: ${{ secrets.DATABASE_STORAGE_MONITOR_CA }}
          DB_STORAGE_LIMIT_MIB: ${{ inputs.test_alert && '0.01' || vars.DATABASE_STORAGE_LIMIT_MIB }}
          DB_STORAGE_ALERT_PERCENT: ${{ vars.DATABASE_STORAGE_ALERT_PERCENT || '80' }}
